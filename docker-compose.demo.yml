# The public demo stack (issue #147).
#
# A Play reviewer who cannot get past the login screen is an "app not
# functional" rejection, and the closed-test testers (#173) hit the same wall.
# This is the small public server they sign in to: public-domain books only, one
# read-only account whose password is published on purpose, and nothing on it
# that matters if it is abused.
#
# It is NOT the personal server, and it does not share anything with it — its own
# database volume, its own book directories, its own secrets. Run it from its own
# directory so Compose gives it its own project name:
#
#     docker compose -f docker-compose.demo.yml up -d
#
# The full runbook — the account, the starter library, the one transcript, the
# tunnel — is docs/demo-server.md. This file is only the stack.
#
# Images come from GHCR, built from `main` by .github/workflows/publish-images.yml
# and pulled by the watchtower service below. Nothing here is built on the host:
# a locally built image is one Watchtower cannot update, which is how a demo
# silently stops tracking main while still looking healthy.

services:
  server:
    image: ghcr.io/jlafuenti/tandem-server:main
    # Opt in to Watchtower. See the watchtower service for why this label, and
    # not a global watch, is what keeps the rest of this host safe.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Assembled into DATABASE_URL by config.py when DATABASE_URL is unset.
      POSTGRES_HOST: demo-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: booksync
      POSTGRES_DB: booksync
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      CREDENTIAL_ENC_KEYS_FILE: /run/secrets/credential_enc_keys
      EBOOK_DIR: /data/ebooks
      AUDIOBOOK_DIR: /data/audiobooks
      APP_DATA_DIR: /data/app
      COVERS_DIR: /data/covers
      IMPORTS_DIR: /data/imports
      BACKUPS_DIR: /data/backups
      # No transcription on the demo. The single transcript is generated by hand
      # before anyone else sees the server, so nothing here needs a working
      # provider and the image carries no local Whisper model.
      TRANSCRIPTION_PROVIDER: remote
      # Everyone uses the one published account, so nobody signs up. This is the
      # env-level override in `registration.effective_mode`, which forces
      # MODE_CLOSED whatever the `registration_mode` row says — so a slip on the
      # System page cannot reopen a public server to sign-ups. Note it is
      # `ALLOW_PUBLIC_REGISTRATION` and not `REGISTRATION_MODE`: the latter is a
      # DB row, not a Settings alias, and `config.py` sets `extra = "ignore"`,
      # so putting it here would look right and do nothing.
      ALLOW_PUBLIC_REGISTRATION: "false"
      # Behind the tunnel the app is same-origin, so this only has to name the
      # public hostname. Substitute your own; no real host may appear in this
      # repository (pinned by server/tests/test_repo_hygiene.py).
      CORS_ORIGINS: https://demo.example.com
      APP_ENV: prod
    secrets:
      - postgres_password
      - jwt_secret_key
      - credential_enc_keys
    volumes:
      - demo_books:/data
    depends_on:
      - demo-db
    restart: unless-stopped
    # Same limits as the real stack: this box also hosts things that matter.
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  demo-db:
    image: postgres:16-alpine
    # Deliberately NOT watchtower-enabled: an unattended major-version jump on a
    # Postgres data directory is how you lose the database. Pin and upgrade it
    # by hand.
    environment:
      POSTGRES_USER: booksync
      POSTGRES_DB: booksync
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - demo_db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booksync -d booksync"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ghcr.io/jlafuenti/tandem-web:main
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Loopback only. The demo is published through a Cloudflare Tunnel, which
    # reaches this from the host — there is no port open to the internet and no
    # certificate to renew here. docs/demo-server.md, "Publishing it".
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/index.html | grep -q 'id=\"root\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  watchtower:
    image: containrrr/watchtower
    # --label-enable is the load-bearing flag, not a preference.
    #
    # Watchtower's default is to update EVERY running container on the host.
    # This host also runs the operator's production Tandem stack and unrelated
    # services, so an unscoped watchtower would pull `main` images over
    # production and restart things that have nothing to do with Tandem. With
    # --label-enable it touches only the two services above, which opt in by
    # label. Pinned by test_watchtower_only_touches_containers_that_opt_in.
    #
    # --cleanup drops the superseded image so a daily pull does not fill the
    # disk over a few months.
    command: --label-enable --cleanup --interval 3600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  demo_db:
  demo_books:

# Same file-based convention as the real stack (#180): secrets never appear in
# `environment:`, and a missing or empty file is a startup error naming the
# variable rather than a silent fallback. Create them before first start —
# docs/demo-server.md, "Compose and env".
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  jwt_secret_key:
    file: ./secrets/jwt_secret_key
  credential_enc_keys:
    file: ./secrets/credential_enc_keys
