# Alembic configuration for the BookSync server.
#
# The database URL is intentionally NOT set here — env.py derives a sync
# (psycopg2) URL from the app's settings.DATABASE_URL at runtime, so migrations
# and the app always point at the same database with no duplicated config.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Logging — keep it quiet by default; the deploy step surfaces alembic's own
# "Running upgrade ..." lines on stdout regardless.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
