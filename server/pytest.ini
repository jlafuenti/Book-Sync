[pytest]
# Run from the server/ directory: `cd server && pytest`
asyncio_mode = auto
testpaths = tests
# conftest.py also inserts the server dir into sys.path, so the suite runs
# regardless of the working directory (matches the existing sys.path.insert
# pattern the pre-existing tests use).
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
