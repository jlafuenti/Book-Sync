[pytest]
# Run from the server/ directory: `cd server && pytest`
asyncio_mode = auto
testpaths = tests
# conftest.py also inserts the server dir into sys.path, so the suite runs
# regardless of the working directory (matches the existing sys.path.insert
# pattern the pre-existing tests use).
pythonpath = .
# Surface our own deprecations (they show in the warnings summary). Only silence
# known noise we don't control or have already triaged. Don't blanket-ignore.
filterwarnings =
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:pkg_resources
    # Pervasive datetime.utcnow() deprecation (Python 3.12+) — tracked as separate
    # tech-debt cleanup (migrate to datetime.now(UTC)); silenced to keep signal clear.
    ignore:datetime.datetime.utcnow:DeprecationWarning
