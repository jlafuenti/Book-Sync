[pytest]
# Run from the server/ directory: `cd server && pytest`
asyncio_mode = auto
testpaths = tests
# Don't walk into virtualenvs. pytest's default norecursedirs covers `venv` and
# dotted dirs, but not e.g. `tests/booksync-testenv2/` — a stray env like that
# sits inside testpaths, so collection crawls its whole site-packages tree and
# can pick up third-party test files.
norecursedirs = .* venv .venv *env env node_modules build dist *.egg
# conftest.py also inserts the server dir into sys.path, so the suite runs
# regardless of the working directory (matches the existing sys.path.insert
# pattern the pre-existing tests use).
pythonpath = .
# Surface our own deprecations (they show in the warnings summary). Only silence
# known noise we don't control or have already triaged. Don't blanket-ignore.
filterwarnings =
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:pkg_resources
    # datetime.utcnow() is gone from OUR code (issue #52) — every timestamp
    # comes from utils.utcnow(), gated statically by
    # tests/test_time_contract.py (AST walk over every file under server/).
    # The blanket runtime ignore that python-jose 3.3.0 forced (it called
    # utcnow() internally) was dropped with the migration to PyJWT (#157).
