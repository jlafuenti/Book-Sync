# Docker Compose for the Jetson Orin Nano transcription server.
# Deploy this file ON the Jetson, from inside this jetson/ directory.
#
# Usage:
#   cp docker-compose.example.yml docker-compose.yml
#   # edit docker-compose.yml: set TRANSCRIPTION_API_KEY below
#   docker compose up -d --build
#
# See README.md (this directory) for the full deploy walkthrough (sparse
# clone, generating the key, pointing the main Tandem server at this host).
#
# docker-compose.yml is gitignored (it carries a real secret below), so
# pulling updates to this template never conflicts with your local copy.
#
# name: pinned rather than left to default to the checkout directory's
# basename — otherwise renaming/relocating the checkout silently creates a
# new, empty set of volumes instead of reusing the ones with your
# already-downloaded model.
name: booksync-transcriber
services:
  transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booksync_transcriber
    runtime: nvidia
    restart: unless-stopped
    # LAN-ONLY. This worker speaks plaintext HTTP and authenticates with a
    # shared bearer token, so every request puts that token on the wire in
    # cleartext: it MUST NOT be reachable from the internet. The unqualified
    # form below publishes on *every* interface — replace <lan-ip> with this
    # host's LAN address to bind just that one, or put it behind TLS (Caddy,
    # Tailscale) if it has to cross networks.
    ports:
      # - "<lan-ip>:9000:9000"   # preferred: bind one interface
      - "9000:9000"
    volumes:
      - whisper_models:/root/.cache/huggingface/hub # Persist downloaded models
      # Checkpoints (and the audio retained for a paused job) survive restarts.
      # Size this for one audiobook: a paused job parks its source file here
      # until it resumes, completes, is cancelled, or ages out after 48h.
      # TMPDIR below puts uploads on this same volume, so size it for the
      # audiobook *twice over* — the spooled request body plus the copy.
      - booksync_checkpoints:/tmp/booksync_checkpoints
    environment:
      # The base image's own default is /data/models/huggingface, which is
      # *not* the volume above — without this line every container recreate
      # downloads the model again (issue #374).
      - HF_HOME=/root/.cache/huggingface
      - WHISPER_MODEL=medium
      - WHISPER_COMPUTE_TYPE=float16
      - WHISPER_DEVICE=cuda
      - VAD_FILTER=true
      # ISO 639-1 code (en, es, fr, de, …) forced on every chunk. Leave blank
      # to auto-detect on the first chunk of each file and pin that answer for
      # the rest of it. Pin it if your library is single-language: a chunk that
      # opens on music or a foreign epigraph can otherwise be detected as
      # another language and come back as transliterated garbage.
      - WHISPER_LANGUAGE=
      # Largest accepted upload, in bytes (default 4 GiB). Anything over this
      # gets a 413 before the body is read; 0 disables the cap.
      - MAX_UPLOAD_BYTES=4294967296
      # Put the spooled upload and its copy on the sized volume above rather
      # than the container's default /tmp. The server creates this at startup.
      - TMPDIR=/tmp/booksync_checkpoints/tmp
      # Release the model (~4GB of unified memory for `medium`) after this many
      # idle minutes; it reloads on the next job. Set 0 to keep it resident.
      # Pair this with Tandem → Settings → Transcription → "Only transcribe
      # during off-hours" if this GPU is shared with something latency-sensitive.
      - MODEL_IDLE_UNLOAD_MIN=30
      # Shared secret required on every request to this server. Generate it in
      # Tandem → Settings → Transcription → Remote Server API Key ("Generate
      # Key" button — persists it there and shows the value once), then paste
      # the same value here. Without it, this container refuses to start.
      # CLI fallback: python -c "import secrets; print(secrets.token_urlsafe(32))"
      - TRANSCRIPTION_API_KEY=
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  whisper_models:
  booksync_checkpoints:
