# Docker Compose for the Jetson Orin Nano transcription server.
# Deploy this file ON the Jetson, from inside this jetson/ directory.
#
# Usage:
#   cp docker-compose.example.yml docker-compose.yml
#   # edit docker-compose.yml: set TRANSCRIPTION_API_KEY below
#   docker compose up -d --build
#
# See README.md (this directory) for the full deploy walkthrough (sparse
# clone, generating the key, pointing the main BookSync server at this host).
#
# docker-compose.yml is gitignored (it carries a real secret below), so
# pulling updates to this template never conflicts with your local copy.
#
# name: pinned rather than left to default to the checkout directory's
# basename — otherwise renaming/relocating the checkout silently creates a
# new, empty set of volumes instead of reusing the ones with your
# already-downloaded model.
name: booksync-transcriber
services:
  transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booksync_transcriber
    runtime: nvidia
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - whisper_models:/root/.cache/huggingface/hub # Persist downloaded models
      # Checkpoints (and the audio retained for a paused job) survive restarts.
      # Size this for one audiobook: a paused job parks its source file here
      # until it resumes, completes, is cancelled, or ages out after 48h.
      - booksync_checkpoints:/tmp/booksync_checkpoints
    environment:
      - WHISPER_MODEL=medium
      - WHISPER_COMPUTE_TYPE=float16
      - WHISPER_DEVICE=cuda
      - VAD_FILTER=true
      # Release the model (~4GB of unified memory for `medium`) after this many
      # idle minutes; it reloads on the next job. Set 0 to keep it resident.
      # Pair this with BookSync → Settings → Transcription → "Only transcribe
      # during off-hours" if this GPU is shared with something latency-sensitive.
      - MODEL_IDLE_UNLOAD_MIN=30
      # Shared secret required on every request to this server. Generate it in
      # BookSync → Settings → Transcription → Remote Server API Key ("Generate
      # Key" button — persists it there and shows the value once), then paste
      # the same value here. Without it, this container refuses to start.
      # CLI fallback: python -c "import secrets; print(secrets.token_urlsafe(32))"
      - TRANSCRIPTION_API_KEY=
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  whisper_models:
  booksync_checkpoints:
