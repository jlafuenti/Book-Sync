# Template — copy this to docker-compose.yml and fill in your paths/secrets:
#   cp docker-compose.example.yml docker-compose.yml
# docker-compose.yml is gitignored, so your real secrets and volume paths never
# show up in `git status`/`git diff` and can't drift into a merge conflict when
# you pull updates to this template.
#
# `${POSTGRES_PASSWORD}` below is interpolated by compose from a `.env` file
# sitting next to docker-compose.yml. Create it too, or the stack never comes
# up (postgres refuses to initialise with an empty password):
#   cp .env.example .env    # then fill in POSTGRES_PASSWORD
services:
  server:
    build: ./server
    # Run as an unprivileged uid (issue #180). This is the internet-facing
    # process; it shells out to Calibre, ffmpeg, pg_restore and rsync, and every
    # mount below is read-write. As root, one path bug reached the whole library
    # AND the backups.
    #
    # PUID/PGID come from the same `.env` as POSTGRES_PASSWORD and default to
    # 1000:1000. Set them to whatever owns your library on the host —
    # `stat -c '%u:%g' /path/to/your/ebooks` — and read
    # docs/operations.md, "Running as a non-root user" BEFORE the first restart:
    # an existing install needs a one-time ownership change on its app-data and
    # backups directories or the server will not start.
    user: "${PUID:-1000}:${PGID:-1000}"
    # Nothing here needs a Linux capability: uvicorn binds 8000, an unprivileged
    # port, and the process now owns the files it writes.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Last-resort scratch space. The image sets TMPDIR to /data/app/tmp so
    # spooled uploads and ebook conversions land on the app-data volume; this
    # tmpfs only catches anything that ignores TMPDIR, so it is small — and
    # sized, because an unsized tmpfs can grow to half the host's RAM.
    tmpfs:
      - /tmp:size=256m,mode=1777
    # No published port on purpose (issue #179): the web container's nginx
    # proxies /api/ to this service by name, and a reverse proxy on the same
    # host does the same, so publishing 8000 here only opens a second, plain
    # HTTP path around whatever fronts the site. For local debugging bind
    # loopback only:
    #   ports:
    #     - "127.0.0.1:8000:8000"
    volumes:
      - /path/to/your/ebooks:/data/ebooks # ← REPLACE with your ebook folder
      - /path/to/your/audiobooks:/data/audiobooks # ← REPLACE with your audiobook folder
      # Exactly one mount may target /data/app — do not also mount a named
      # volume here. Two sources on one container path means one of them is an
      # invisible, possibly stale copy of your covers, working files and logs.
      # NOTE: ./data lives inside the git checkout, so never `git clean -xfd`
      # here — see docs/operations.md, "Storage".
      - ./data:/data/app
      - ./data/imports:/data/imports # Import-source staging (ACSM inbox/processed/failed)
      # Backups dir (issue #60): the server writes nightly + manual backups here,
      # lists/deletes/downloads them, and restores from them — so it's read-write.
      # IMPORTANT: point this at a NAS path OFF the docker host's disk — a backup
      # on the same disk that dies is worthless.
      - /path/to/nas/booksync-backups:/backups # ← REPLACE with your NAS backups path
    environment:
      # Password comes from POSTGRES_PASSWORD below — keep both in sync.
      - DATABASE_URL=postgresql+asyncpg://booksync:${POSTGRES_PASSWORD}@db:5432/booksync
      # APP_ENV=prod (the default) refuses to start unless JWT_SECRET_KEY,
      # CREDENTIAL_ENC_KEYS, and POSTGRES_PASSWORD below are set to real values.
      # Set APP_ENV=dev only for local development — it allows the zero-config
      # insecure defaults.
      - APP_ENV=prod
      # Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(64))"
      - JWT_SECRET_KEY=
      # Comma-separated list of allowed web origins for CORS. APP_ENV=prod
      # refuses to start with the wildcard default — set this to your actual
      # web frontend origin(s).
      - CORS_ORIGINS=http://localhost:3000
      # Reverse-proxy trust: the address your reverse proxy (Caddy, the `web`
      # nginx container) connects from — check the server log's
      # `request.client.host`; a CIDR/comma list is accepted. uvicorn only
      # honors X-Forwarded-For from these peers; unset, all proxied clients
      # share the proxy's IP and the login rate limit becomes one global
      # bucket. NEVER "*" — that trusts an attacker-chosen header.
      - FORWARDED_ALLOW_IPS=172.16.0.0/12
      - WHISPER_MODEL=medium
      - WHISPER_DEVICE=auto
      # The default image ships no local Whisper stack, so the code default
      # (`remote_with_fallback`) has nothing to fall back to. Use `remote` and
      # point System -> Transcription Settings at the Jetson worker. Only switch
      # to `remote_with_fallback` on an image built with
      # `--build-arg INSTALL_LOCAL_WHISPER=1`.
      - TRANSCRIPTION_PROVIDER=remote
      - EBOOK_DIR=/data/ebooks
      - AUDIOBOOK_DIR=/data/audiobooks
      - APP_DATA_DIR=/data/app
      - IMPORTS_DIR=/data/imports
      # Comma-separated list of Fernet keys used to encrypt source credentials
      # (Audible auth blob, ABS API token). First key encrypts new writes; all
      # keys are tried for decryption, so rotation is "prepend a new key".
      # Generate with:
      #   python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
      - CREDENTIAL_ENC_KEYS=
      # Multipart uploads whose Content-Length exceeds this are refused with
      # 413 before the body is parsed (issue #157). Default is 10 GiB —
      # audiobook uploads are multi-GB, so keep it generous.
      # - UPLOAD_MAX_BYTES=10737418240
      # Failed logins allowed per username before that username is refused with
      # 429 for the rest of the window (issue #296). Only failures count and a
      # success clears the counter. Keying on the username means anyone who
      # knows one can lock the real user out for the window, so the default is
      # deliberately high and the window short — see docs/operations.md,
      # "Login throttling", before changing either.
      # - LOGIN_FAILURE_LIMIT=10
      # - LOGIN_FAILURE_WINDOW_SECONDS=900
    depends_on:
      db:
        condition: service_healthy
    # Without this, a host reboot leaves `server` down for good and `web` nginx
    # crash-looping on a missing upstream (issue #105). Same for `db` below.
    restart: unless-stopped
    # Cap the blast radius of oversized request bodies (issue #151): 4g fits the
    # 4 GiB MAX_UPLOAD_BYTES ceiling plus the app's working set.
    mem_limit: 4g
    pids_limit: 512
    # /api/health is a readiness probe (503 while the DB is unreachable), so
    # Docker sees a broken backend instead of a false "up" (issue #47).
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Uncomment below for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  db:
    image: postgres:16-alpine
    # Deliberately NOT hardened the way `server` and `web` are (issue #180).
    # The official postgres image's entrypoint starts as root, fixes ownership
    # on the data directory, and drops to the `postgres` user itself — so a
    # `user:` here skips that setup and a `cap_drop: [ALL]` takes away the
    # CHOWN/SETUID/SETGID/DAC_OVERRIDE/FOWNER it needs to do it. Either one
    # turns a working database into a boot loop.
    #
    # `no-new-privileges` is safe and applied: it blocks *gaining* privilege via
    # a setuid binary, and root→postgres is the opposite direction.
    # server/tests/test_compose_contract.py pins this exclusion, so a later
    # "finish the hardening" pass fails a test instead of the database.
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_USER=booksync
      # Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      # Only applied on first init of the booksync_db volume — see README for
      # how to rotate the password on an already-initialized deployment.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=booksync
    volumes:
      - booksync_db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U booksync" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backups (issue #60) are owned by the `server` service itself — it runs the
  # nightly schedule, manual backups, restore, and pruning in-process. There is
  # no separate backup container. Schedule + retention are configured from the
  # web UI (System → Backups). See docs/backup-restore.md.

  web:
    build: ./web
    # Same unprivileged uid as `server` (issue #180). The image is built on
    # nginxinc/nginx-unprivileged, whose master process does not need root, and
    # port 3000 is above 1024 — so nothing here needs a capability either.
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # This is the one entry point. Behind a reverse proxy on the same host,
    # bind loopback instead ("127.0.0.1:3000:3000") and let the proxy reach
    # `web:3000` by name — the production layout in docs/operations.md.
    ports:
      - "3000:3000"
    # No API URL is configured here: the web container's nginx proxies /api/ to
    # the `server` service (see web/Dockerfile) and web/src/api.js hardcodes the
    # `/api` base. VITE_* vars are build-time only in any case, so a runtime env
    # on the nginx container could never reach the built bundle.
    depends_on:
      - server
    restart: unless-stopped

volumes:
  booksync_db:
