# Template — copy this to docker-compose.yml and fill in your paths/secrets:
#   cp docker-compose.example.yml docker-compose.yml
# docker-compose.yml is gitignored, so your real secrets and volume paths never
# show up in `git status`/`git diff` and can't drift into a merge conflict when
# you pull updates to this template.
services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    volumes:
      - /path/to/your/ebooks:/data/ebooks # ← REPLACE with your ebook folder
      - /path/to/your/audiobooks:/data/audiobooks # ← REPLACE with your audiobook folder
      - ./data:/data/app
      - ./data/imports:/data/imports # Import-source staging (ACSM inbox/processed/failed)
      # Backups dir (issue #60): the server writes nightly + manual backups here,
      # lists/deletes/downloads them, and restores from them — so it's read-write.
      # IMPORTANT: point this at a NAS path OFF the docker host's disk — a backup
      # on the same disk that dies is worthless.
      - /path/to/nas/booksync-backups:/backups # ← REPLACE with your NAS backups path
    environment:
      # Password comes from POSTGRES_PASSWORD below — keep both in sync.
      - DATABASE_URL=postgresql+asyncpg://booksync:${POSTGRES_PASSWORD}@db:5432/booksync
      # APP_ENV=prod (the default) refuses to start unless JWT_SECRET_KEY,
      # CREDENTIAL_ENC_KEYS, and POSTGRES_PASSWORD below are set to real values.
      # Set APP_ENV=dev only for local development — it allows the zero-config
      # insecure defaults.
      - APP_ENV=prod
      # Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(64))"
      - JWT_SECRET_KEY=
      # Comma-separated list of allowed web origins for CORS. APP_ENV=prod
      # refuses to start with the wildcard default — set this to your actual
      # web frontend origin(s).
      - CORS_ORIGINS=http://localhost:3000
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=auto
      - EBOOK_DIR=/data/ebooks
      - AUDIOBOOK_DIR=/data/audiobooks
      - APP_DATA_DIR=/data/app
      - IMPORTS_DIR=/data/imports
      # Comma-separated list of Fernet keys used to encrypt source credentials
      # (Audible auth blob, ABS API token). First key encrypts new writes; all
      # keys are tried for decryption, so rotation is "prepend a new key".
      # Generate with:
      #   python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
      - CREDENTIAL_ENC_KEYS=
      # Multipart uploads whose Content-Length exceeds this are refused with
      # 413 before the body is parsed (issue #157). Default is 10 GiB —
      # audiobook uploads are multi-GB, so keep it generous.
      # - UPLOAD_MAX_BYTES=10737418240
    depends_on:
      db:
        condition: service_healthy
    # Without this, a host reboot leaves `server` down for good and `web` nginx
    # crash-looping on a missing upstream (issue #105). Same for `db` below.
    restart: unless-stopped
    # /api/health is a readiness probe (503 while the DB is unreachable), so
    # Docker sees a broken backend instead of a false "up" (issue #47).
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Uncomment below for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=booksync
      # Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      # Only applied on first init of the booksync_db volume — see README for
      # how to rotate the password on an already-initialized deployment.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=booksync
    volumes:
      - booksync_db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U booksync" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backups (issue #60) are owned by the `server` service itself — it runs the
  # nightly schedule, manual backups, restore, and pruning in-process. There is
  # no separate backup container. Schedule + retention are configured from the
  # web UI (System → Backups). See docs/backup-restore.md.

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - server
    restart: unless-stopped

volumes:
  booksync_data:
  booksync_db:
