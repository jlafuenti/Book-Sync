name: Publish images

# Container images for the public demo stack (issue #147).
#
# The demo exists because a Play reviewer who cannot get past the login screen is
# an "app not functional" rejection, and the twelve closed-test testers (#173)
# hit the same wall. It runs as a second compose stack on the docker host, and it
# keeps itself current by pulling the images this workflow publishes — nobody
# deploys to it by hand.
#
# Deliberately NOT triggered by `pull_request`: that would build and push images
# from code that has not merged, so anyone able to open a PR could publish an
# image the demo then pulls. `server/tests/test_ci_contract.py` records that
# exemption rather than leaving it to look like an oversight.
on:
  push:
    branches: [main]
  # Watchtower pulls on its own timer, so the images need rebuilding on one too.
  # Without this a quiet week leaves the demo running a base image with whatever
  # CVEs it has picked up since the last push to main.
  schedule:
    - cron: "17 4 * * *"
  # A fix has to be publishable without waiting for the next tick.
  workflow_dispatch:

# Repo-wide default is read-only (#189). The one job that pushes widens it
# itself; nothing else in this file gets a token that can write packages.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    strategy:
      # One image per matrix leg so a web failure does not hide a server
      # failure, and so a rerun can target just the broken half.
      fail-fast: false
      matrix:
        include:
          - image: server
            context: ./server
          - image: web
            context: ./web

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tandem-${{ matrix.image }}
          # `main` is what Watchtower follows. The sha tag is what makes a bad
          # demo diagnosable: it names the commit the running container came
          # from, which `main` alone cannot once it has moved on.
          tags: |
            type=raw,value=main
            type=sha,format=long

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No INSTALL_LOCAL_WHISPER and no local model: the demo transcribes
          # nothing (its one transcript is generated by hand beforehand), and
          # the flag adds gigabytes to an image that is pulled on a timer.
          # docs/demo-server.md, "Build flags".
          cache-from: type=gha
          cache-to: type=gha,mode=max
