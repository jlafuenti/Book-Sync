name: Android tests

# Only runs when the Android app (or the shared sync-parity fixtures it tests) changes.
on:
  push:
    branches: ["**"]
  pull_request:

# The GITHUB_TOKEN this workflow gets: read the code, nothing else. Without
# this block it inherits the repository-wide default, which a settings change
# can widen to write without touching a file here (issue #189). A job that
# needs more declares it on the job, not here.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run JVM unit tests
        working-directory: android
        # JVM unit tests only (no emulator). Compiles the app + test sources and runs the
        # whole suite: the sync-parity tests against the shared fixtures, the matcher
        # internals, the DataStore-backed managers, and the ViewModel tests (mockk +
        # coroutines-test). Espresso/Compose UI tests are deferred (they need an emulator).
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Check coverage floor
        working-directory: android
        # Anti-backslide gate (#95): fails the job if total line coverage of the JVM unit
        # tests drops below the floor in app/build.gradle.kts. Reuses the test run above —
        # Kover does not re-execute the suite. See docs/testing.md ("Android").
        run: ./gradlew :app:koverXmlReportDebug :app:koverVerifyDebug --stacktrace

      - name: Build the release variant (unsigned — R8 runs)
        working-directory: android
        # The release path had never been compiled anywhere: no release artifact
        # had ever been produced in this tree and CI only ever built debug, so a
        # missing keep rule would first have surfaced as a crash in a user's hands
        # (issues #144, #145). Unsigned is the point — this proves R8 and the
        # shrinker, not the signature, and it also proves the signing config stays
        # optional on a checkout with no local.properties.
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload coverage report
        # Uploaded even when the gate fails, so a coverage drop can be diagnosed.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-coverage
          path: android/app/build/reports/kover/reportDebug.xml
          if-no-files-found: warn
