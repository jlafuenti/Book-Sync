name: Jetson tests

on:
  push:
    branches: ["**"]
    paths:
      - "jetson/**"
  pull_request:
    paths:
      - "jetson/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetson

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install light dependencies
        # fastapi/uvicorn/python-multipart/pytest — NOT faster-whisper
        # (GPU-only build, not pip-installable off-device) or nltk's data
        # corpus (network download). conftest.py stubs both of those modules
        # so server.py can still be imported for unit testing.
        # python-multipart is required even though these tests never send
        # form data: FastAPI's route registration for the /v1/transcribe
        # endpoint (which uses File(...)) checks for it eagerly at import
        # time and raises RuntimeError if it's missing.
        # httpx backs fastapi.testclient.TestClient, which the off-hours
        # endpoint tests (#106) drive — viable now that startup no longer
        # loads the GPU model.
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.110.0" "uvicorn>=0.27.0" "python-multipart>=0.0.9" httpx pytest

      - name: Run tests
        run: python -m pytest test_server.py -v
