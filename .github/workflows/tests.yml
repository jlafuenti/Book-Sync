name: Server tests

on:
  push:
    branches: [main]
  pull_request:

# The GITHUB_TOKEN this workflow gets: read the code, nothing else. Without
# this block it inherits the repository-wide default, which a settings change
# can widen to write without touching a file here (issue #189). A job that
# needs more declares it on the job, not here.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so diff-cover can compare a PR against its base branch.
          fetch-depth: 0
          # Check out the PR's actual head commit (not the ephemeral merge commit
          # GitHub creates for pull_request), so coverage.xml line numbers and the
          # diff line numbers line up for diff-cover. Falls back to the pushed SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The heavy transcription stack (torch, openai-whisper) is not in
          # requirements.txt — it lives in requirements-local.txt and is an
          # opt-in build. The suite is import-light besides: routers import
          # those lazily, and the alignment tests only need numpy (pinned in
          # requirements-dev.txt). This used to filter requirements.txt through
          # grep, which had been a no-op since the split (issue #240).
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # conftest points DATABASE_URL at a throwaway SQLite DB, so no Postgres
        # service is needed here. The Postgres migration test self-skips.
        # Global coverage floor (anti-backslide) — ratchet upward over time; see
        # docs/testing.md for the policy.
        run: pytest -v --cov=. --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=30

      - name: OpenAPI export is current (issue #260)
        # Drift gate, same shape as `alembic check` below: regenerate
        # docs/openapi.json from the live app and fail if it differs from what
        # is committed. Runs from the repo root so `git diff` sees the path.
        # The committed export is the API reference for everyone not running in
        # dev — the interactive /docs is dev-only (issue #263) — so a stale one
        # is worse than none.
        working-directory: ${{ github.workspace }}
        run: |
          python server/scripts/export_openapi.py
          git diff --exit-code docs/openapi.json

      - name: Check patch coverage (PRs)
        # Stop-the-bleeding gate: lines a PR changes must be >=80% covered. Runs
        # from the repo root so diff-cover can resolve git paths. The exclude list
        # is the intentionally-manual / hardware / env-specific set (kept in sync
        # with docs/testing.md).
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          # diff-cover matches --exclude as fnmatch globs against the full path
          # ('*' spans '/'), so the '*/' prefix form is what matches. NOTE: --exclude
          # takes all patterns after a SINGLE flag (repeated flags => only the last
          # wins), so keep them as one space-separated list. --markdown-report writes
          # a summary we surface on the PR (below), even when the gate fails.
          diff_exit=0
          diff-cover server/coverage.xml \
            --markdown-report patch-coverage.md \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=80 \
            --exclude '*/database.py' '*/services/transcription.py' '*/transcription_providers/*' \
              '*/services/import_sources/*' '*/import_scheduler.py' '*/abs_metadata.py' \
              '*/audio_integrity.py' '*/ebook_integrity.py' '*/epub_parser.py' '*/library_verify.py' \
              '*/routers/chapters.py' '*/routers/files.py' '*/routers/import_sources.py' \
              '*/routers/troubleshoot.py' '*/scripts/*' || diff_exit=$?
          {
            echo "### Patch coverage (changed lines)"
            echo
            cat patch-coverage.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$diff_exit"

  audit:
    # Dependency-vulnerability gate (issue #157): fail on any known advisory
    # against requirements.txt that is not explicitly allow-listed — with a
    # written justification — in server/audit-ignore.txt.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: pip-audit (strict, with allow-list)
        run: |
          # Expand audit-ignore.txt (advisory IDs, one per line, # comments
          # allowed) into --ignore-vuln flags. `|| true` because an empty
          # allow-list makes grep exit 1, which is the normal healthy state.
          IGNORE_FLAGS=$(grep -vE '^\s*(#|$)' audit-ignore.txt | sed 's/^/--ignore-vuln /' | tr '\n' ' ' || true)
          pip-audit -r requirements.txt --strict $IGNORE_FLAGS

  migrations:
    # Exercises the Alembic migrations against real Postgres (the SQLite job
    # can't — they use JSONB / native enums). Runs the migration test suite
    # (upgrade / downgrade / reversibility / drift) plus an explicit
    # `alembic upgrade head` + `alembic check` gate for clear logs.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booksync
          POSTGRES_PASSWORD: booksync
          POSTGRES_DB: booksync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booksync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migration tests (upgrade / downgrade / drift)
        env:
          RUN_PG_TESTS: "1"
          DATABASE_URL: postgresql+asyncpg://booksync:booksync@localhost:5432/booksync_test
        run: pytest tests/test_migrations_postgres.py -v

      - name: Explicit alembic upgrade head + drift check
        # Belt-and-suspenders on top of the test above, with readable CLI output:
        # a fresh upgrade must succeed and `alembic check` must find no diff
        # between the ORM models and the migrations.
        env:
          DATABASE_URL: postgresql+asyncpg://booksync:booksync@localhost:5432/booksync_test
        run: |
          alembic upgrade head
          alembic check
