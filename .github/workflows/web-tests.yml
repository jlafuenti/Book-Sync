name: Web tests

# Only runs when the web app (or this workflow) changes.
on:
  push:
    branches: [main]
  pull_request:

# The GITHUB_TOKEN this workflow gets: read the code, nothing else. Without
# this block it inherits the repository-wide default, which a settings change
# can widen to write without touching a file here (issue #189). A job that
# needs more declares it on the job, not here.
permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history + the PR head SHA so diff-cover's changed-line mapping
          # lines up with the coverage report (see the server workflow for why).
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Dependency-vulnerability gate (issue #157): `npm audit --omit=dev`
        # semantics with an allow-list, which npm audit lacks natively —
        # audit-ci reads web/audit-ci.jsonc (skip-dev is set there), where
        # every allow-listed advisory carries its written justification.
        # Dev-only deps (vite, vitest, eslint...) never ship to the browser.
        run: npx --yes audit-ci@^7 --config audit-ci.jsonc

      - name: Run tests + coverage
        run: npm run coverage

      - name: Check patch coverage (PRs)
        # Stop-the-bleeding gate: changed web lines must be >=80% covered. Vacuous
        # (passes) when a PR changes no source lines. Reuses diff-cover for parity
        # with the server. The other gate — the global anti-backslide floor — is
        # enforced by vitest `coverage.thresholds` in web/vite.config.js, so the
        # "Run tests + coverage" step above already fails on a total drop (on push
        # as well as on PRs). See docs/testing.md for the ratchet.
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --quiet diff-cover
          git fetch --no-tags origin ${{ github.base_ref }}
          diff_exit=0
          diff-cover web/coverage/cobertura-coverage.xml \
            --markdown-report web-patch-coverage.md \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=80 || diff_exit=$?
          {
            echo "### Web patch coverage (changed lines)"
            echo
            cat web-patch-coverage.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$diff_exit"
